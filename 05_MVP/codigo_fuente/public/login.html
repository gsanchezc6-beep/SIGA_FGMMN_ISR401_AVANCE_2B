<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGA | Iniciar sesión</title>
  <link rel="stylesheet" href="/css/styles.css" />
  <script src="/js/theme.js"></script>
</head>
<body>
  <div class="login-shell">
    <div class="login-card">
      <h1>SIGA</h1>
      <div class="subtitle">Sistema Inteligente de Gestión de Aulas</div>
      <form id="login-form">
        <div class="field">
          <label for="usuario">Usuario</label>
          <input id="usuario" name="usuario" type="text" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
        </div>
        <button class="btn primary" type="submit" style="width:100%">Ingresar</button>
        <div class="login-error" id="login-error"></div>
      </form>
      <div class="hint">
        Cuentas de demo: <strong>admin / admin123</strong> (Administrador) &middot;
        <strong>tecnico / tecnico123</strong> (Técnico de Infraestructura)
      </div>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script>
    (async () => {
      const sesion = await api('/api/auth/me');
      if (sesion.usuario) {
        window.location.href = '/panel.html';
      }
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errorBox = document.getElementById('login-error');
      errorBox.textContent = '';
      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('password').value;

      try {
        await api('/api/auth/login', { method: 'POST', body: { usuario, password } });
        window.location.href = '/panel.html';
      } catch (err) {
        errorBox.textContent = err.message;
      }
    });
  </script>
</body>
</html>
